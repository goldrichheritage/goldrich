<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Museum Collection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="detail-page">

<div class="page-shell detail-shell">

    <div class="inner-side-marker" aria-hidden="true">
            <a href="collection.html">
                <span>OBJECTS WITH A LIFE | BEYOND DISPLAY</span>
            </a>
    </div>

    <!-- Header -->
    <header class="page-header">

        <div class="eyebrow">
            Curated Collection
        </div>

        <div class="header-row">

            <div>

                <h1>
                    <a class="brand-home-link" href="index.html">GOLDRICH Collection</a>
                </h1>

                <p class="subtitle">
                    A digital archive of our art objects and cultural heritage.
                </p>

            </div>

            <div class="header-badge">
                Featured archive
            </div>

        </div>

    </header>


    <!-- Back -->
    <div class="detail-navigation">

        <a href="collection.html" id="back-to-Collection">
            ← Back to Collection
        </a>

    </div>


    <!-- Object -->
    <div class="object-detail">

        <!-- =========================
             LEFT : IMAGE
             ========================= -->

        <div class="object-image">

            <div class="main-image">

                <img
                    id="mainImage"
                    src=""
                    alt=""
                >

            </div>


            <div class="image-counter" id="imageCounter">
                1 / 1
            </div>


            <div class="thumbnail-images"
                 id="thumbnailImages">
            </div>

        </div>


        <!-- =========================
             RIGHT : INFORMATION
             ========================= -->

        <div class="object-info">

            <h1 id="objectName">
            </h1>

            <h2 id="englishName">
            </h2>


            <p>
                <strong>Collection Number:</strong>
                <span id="collectionNumber"></span>
            </p>


            <p>
                <strong>Object Type:</strong>
                <span id="type"></span>
            </p>


            <p>
                <strong>Material:</strong>
                <span id="material"></span>
            </p>


            <p>
                <strong>Period:</strong>
                <span id="period"></span>
            </p>


            <p class="dimensions-row">

                <strong>
                    Dimensions:
                </strong>

                <span
                    class="dimensions-value"
                    id="dimensions">
                </span>

            </p>


            <p>
                <strong>Collector:</strong>
                <span id="collector"></span>
            </p>

        </div>

    </div>


    <!-- =========================
         DESCRIPTION
         ========================= -->

    <div class="object-description">

        <h2>
            Introduction
        </h2>

        <p id="introduction">
        </p>

    </div>


</div>


<!-- Image Viewer -->

<div class="image-viewer" id="imageViewer">

    <button
        class="image-viewer-close"
        id="imageViewerClose">
        ×
    </button>

    <img
        class="image-viewer-content"
        id="imageViewerContent"
        src=""
        alt=""
    >

</div>


<script src="detail.js"></script>

</body>

</html>
